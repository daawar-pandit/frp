# frps development configuration
# This config is for local dashboard development

bindAddr = "0.0.0.0"
bindPort = 443

# Dashboard web server configuration
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "admin"

# For development: Uncomment this line to load static assets from disk
# This allows hot-reloading of frontend changes without rebuilding
# webServer.assetsDir = "./web/frps/dist"

# Enable prometheus metrics
enablePrometheus = true

# Logging
log.to = "console"
log.level = "debug"

# Authentication
auth.method = "token"
auth.token = "dev_token_12345"

# Allow all ports for development
# maxPortsPerClient = 0
